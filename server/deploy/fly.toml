# Fly.io (도커 이미지로 올리고 HTTPS·wss 를 자동으로). 저장소 맨 위에서:  fly launch --no-deploy --copy-config -c server/deploy/fly.toml
# 그다음  fly volumes create solbaram_saves --size 1 --region nrt  →  fly deploy -c server/deploy/fly.toml
# 방이 한 프로세스 메모리에 있으니 기계는 꼭 하나만, 멈추지 않게 둔다.
app = "solbaram-village"
primary_region = "nrt"

[build]
  dockerfile = "../Dockerfile"

[env]
  PORT = "8080"
  SAVE_DIR = "/srv/saves"

[[mounts]]
  source = "solbaram_saves"
  destination = "/srv/saves"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
